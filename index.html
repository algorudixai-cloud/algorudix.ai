<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title and descriptions are replaced at build time from content/site.db (settings). -->
    <title>Algorudix.ai</title>
    <meta name="description" content="" />
    <meta property="og:title" content="" />
    <meta property="og:description" content="" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#ff7a1f" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.png" />
    <script>
      (function () {
        var p = window.location.pathname;
        if (window.location.hostname.endsWith('github.io') && p.indexOf('/algorudix.ai') === 0 && !p.endsWith('/')) {
          window.location.replace(window.location.origin + p + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
    <script>
      // Apply the saved theme before the first paint, and mark that scripts run (motion is gated on .js).
      (function () {
        var root = document.documentElement;
        root.classList.add('js');
        try {
          if (localStorage.getItem('algorudix-theme')) localStorage.removeItem('algorudix-theme');
          if (localStorage.getItem('algorudix-theme-mode') === 'dark') root.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font: 18px/1.5 Arial, sans-serif">
        Algorudix.ai builds AI automation, dashboards and custom software. Email
        <a href="mailto:contact@algorudixai.com">contact@algorudixai.com</a> or call +91 63692 66589.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
